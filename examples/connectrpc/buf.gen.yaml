# Regenerate with: buf generate   (from this directory; needs buf,
# protoc-gen-go and protoc-gen-connect-go on PATH). The output is committed.
version: v2
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative
