name: Release

# Cuts a release: verifies the module, creates an annotated tag on the
# checked-out commit, and publishes a GitHub Release with generated notes.
# Go module consumers pick the tag up from the module proxy.
#
# Two ways in:
#   - CI calls this workflow when a push to main has a head commit whose
#     subject is "release: vX.Y.Z" and every other CI job has passed.
#   - Run it by hand from the Actions tab with the version to publish.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like v1.2.3 or v1.2.3-rc.1, got '$VERSION'"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Verify
        run: |
          go vet ./...
          go test ./...

      - name: Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --title "$VERSION" --generate-notes --verify-tag

      - name: Warm the Go module proxy
        run: |
          curl -fsS "https://proxy.golang.org/github.com/pobochiigo/silo/@v/$VERSION.info" \
            || echo "::warning::module proxy has not indexed $VERSION yet; it will on first go get"
