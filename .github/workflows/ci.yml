name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  examples:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: silo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d silo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/silo?sslmode=disable
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/go.mod
          check-latest: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Check generated middlewares are current
        run: go generate ./... && git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

      - name: Build
        run: go build ./...

      - name: Run the middlegen example
        run: go run ./middlegen

      - name: Run the uow example on every driver
        run: |
          for driver in sql sqlx pgx; do
            go run ./uow -driver "$driver" -workers 4 -transfers 10
          done

      - name: Run the telemetry example
        run: go run ./telemetry

      - name: Run the connectrpc example
        run: go run ./connectrpc

  # A push to main whose head commit subject is "release: vX.Y.Z" asks for
  # that release. The version is parsed here and the release job below cuts
  # it once the test and examples jobs have passed; any other push leaves the
  # version empty and the release job is skipped.
  release-version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="${MESSAGE%%$'\n'*}"
          if [[ "$subject" =~ ^\(?release\)?:?[[:space:]]+(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)([[:space:]]|$) ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "release ${BASH_REMATCH[1]} requested by the head commit: $subject"
          elif [[ "$subject" =~ ^\(?release\)?(:|[[:space:]]) ]]; then
            echo "::warning::head commit subject '$subject' starts with release but names no vX.Y.Z version; not releasing"
          else
            echo "not a release commit: $subject"
          fi

  release:
    needs: [test, examples, release-version]
    if: needs.release-version.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-version.outputs.version }}
